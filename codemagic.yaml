workflows:
  ios-check:
    name: فحص البناء (بدون حساب آبل)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: ترتيب الملفات
        script: |
          mkdir -p www resources
          cp app.html www/index.html
          cp quran.json www/quran.json
          cp icon.png resources/icon.png
          grep -q NativeSR www/index.html && test -s www/quran.json
      - name: تثبيت الحزم
        script: npm install
      - name: إضافة منصة iOS
        script: |
          npx cap add ios
          npx capacitor-assets generate --ios || true
          npx cap sync ios
      - name: بناء على المحاكي
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -40
  ios-testflight:
    name: القرآن الكريم - iOS
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: Codemagic   # اسم المفتاح الذي تضيفه في إعدادات Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hamed.quran
      vars:
        APP_ID: "0000000000"         # رقم التطبيق من App Store Connect (Apple ID) بعد إنشائه
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: ترتيب الملفات
        script: |
          mkdir -p www resources
          cp app.html www/index.html
          cp quran.json www/quran.json
          cp icon.png resources/icon.png
          test -s www/index.html && grep -q NativeSR www/index.html && test -s www/quran.json
      - name: تثبيت الحزم
        script: npm install
      - name: إضافة منصة iOS
        script: |
          npx cap add ios
          npx capacitor-assets generate --ios || true
      - name: صلاحيات المايك والتعرف على الصوت
        script: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'يُستخدم الميكروفون لتتبّع قراءتك للقرآن.'" $PL
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'يُستخدم التعرف على الصوت لتتبّع القراءة والانتقال بين الآيات.'" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'القرآن الكريم'" $PL || true
      - name: مزامنة
        script: npx cap sync ios
      - name: رقم البناء
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 0) + 1))
      - name: تجهيز التوقيع
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: بناء ملف IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
